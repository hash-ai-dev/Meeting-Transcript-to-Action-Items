<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyWait" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81D4FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB342;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#558B2F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="400" fill="url(#skyWait)" />
  
  <!-- Clouds (Pixely) -->
  <rect x="100" y="50" width="60" height="20" fill="white" opacity="0.8" />
  <rect x="120" y="40" width="40" height="40" fill="white" opacity="0.8" />
  <rect x="500" y="80" width="80" height="25" fill="white" opacity="0.8" />
  
  <!-- Mountains -->
  <path d="M0 250 L150 100 L300 250 Z" fill="#5C6BC0" opacity="0.6"/>
  <path d="M200 250 L400 50 L600 250 Z" fill="#3949AB" opacity="0.7"/>
  <path d="M500 250 L700 120 L900 250 Z" fill="#5C6BC0" opacity="0.6"/>
  
  <!-- Hills -->
  <path d="M0 250 Q 400 200 800 250 L 800 400 L 0 400 Z" fill="url(#grass)" />
  
  <!-- Sunflowers overlay -->
  <circle cx="100" cy="350" r="20" fill="#FFD700" />
  <circle cx="100" cy="350" r="5" fill="#3E2723" />
  
  <circle cx="700" cy="320" r="25" fill="#FFD700" />
  <circle cx="700" cy="320" r="6" fill="#3E2723" />
  
  <circle cx="400" cy="380" r="15" fill="#FFD700" />
  <circle cx="400" cy="380" r="4" fill="#3E2723" />
</svg>
